<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シート切り出しツール</title>
<style>
:root{--bg:#0b0f1c;--card:#141b30;--ink:#eef2fa;--sub:#93a0bb;--gold:#e8c15a;--line:#26304d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans JP",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
p{line-height:1.7}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
label{font-size:14px;display:flex;gap:6px;align-items:center}
input[type=number]{width:64px;padding:6px;border-radius:8px;border:1px solid var(--line);background:#0b1124;color:var(--ink)}
input[type=text]{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#0b1124;color:var(--ink);width:260px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:linear-gradient(180deg,#f6e3a1,#c9a227);color:#1c1405}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
#drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;cursor:pointer}
#drop.on{border-color:var(--gold)}
#preview{position:relative;display:inline-block;max-width:100%;margin-top:10px}
#preview img{max-width:100%;display:block;border-radius:8px}
#grid{position:absolute;inset:0;pointer-events:none}
#cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cell{background:repeating-conic-gradient(#2a3354 0 25%,#1d2440 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.cell img{width:100%;aspect-ratio:1;object-fit:contain}
.cell input{width:100%;margin-top:6px;font-size:12px}
.cell .x{font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>シート切り出しツール</h1>
  <p class="sub">AIで作った「1枚に複数のイラスト（格子状）」の画像を、1つずつのPNGに切り分けます。背景の単色を透明にして、余白も自動で切り落とします。画像はこのパソコンの中だけで処理され、どこにも送信されません。</p>

  <div class="card">
    <div id="drop">ここに画像をドラッグ ＆ ドロップ（またはクリックして選ぶ）<input type="file" id="file" accept="image/*" hidden></div>
    <div id="preview" hidden><img id="src"><svg id="grid"></svg></div>
  </div>

  <div class="card">
    <div class="row">
      <label>横の数 <input type="number" id="cols" value="5" min="1" max="20"></label>
      <label>縦の数 <input type="number" id="rows" value="2" min="1" max="20"></label>
      <label>外側の余白（%） <input type="number" id="pad" value="0" min="0" max="20"></label>
      <label><input type="checkbox" id="bg" checked> 背景を透明にする</label>
      <label>許容範囲 <input type="number" id="tol" value="40" min="0" max="200"></label>
      <label><input type="checkbox" id="trim" checked> 余白を切り落とす</label>
    </div>
    <div class="row" style="margin-top:12px">
      <label>ファイル名 <input type="text" id="names" value="b1,b2,b3,b4,b5,b6,b7,b8,b9,b10"></label>
      <span class="sub">左上から右へ順番。カンマ区切り。足りない分は item-番号 になります</span>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="cut">切り出す</button>
      <button class="ghost" id="all" hidden>まとめて保存</button>
    </div>
    <p class="sub" style="margin:10px 0 0">背景の色は、画像の四すみの色から自動で判断します。白や単色の背景で作ってもらうときれいに抜けます。</p>
  </div>

  <div id="cells"></div>
</main>
<script>
const $=id=>document.getElementById(id);
let img=null, outs=[];
const drop=$('drop');
drop.onclick=()=>$('file').click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};
$('file').onchange=e=>{if(e.target.files[0])load(e.target.files[0])};
function load(f){
  const u=URL.createObjectURL(f);
  img=new Image();img.onload=()=>{$('src').src=u;$('preview').hidden=false;drawGrid()};img.src=u;
}
['cols','rows','pad'].forEach(id=>$(id).oninput=drawGrid);
function cellRects(){
  const W=img.naturalWidth,H=img.naturalHeight,c=+$('cols').value,r=+$('rows').value,p=+$('pad').value/100;
  const x0=W*p,y0=H*p,w=(W-2*x0)/c,h=(H-2*y0)/r,out=[];
  for(let j=0;j<r;j++)for(let i=0;i<c;i++)out.push([x0+i*w,y0+j*h,w,h]);
  return out;
}
function drawGrid(){
  if(!img)return;
  const W=img.naturalWidth,H=img.naturalHeight;
  $('grid').setAttribute('viewBox',`0 0 ${W} ${H}`);
  $('grid').innerHTML=cellRects().map(([x,y,w,h],k)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#e8c15a" stroke-width="${W/300}"/><text x="${x+W/120}" y="${y+W/40}" fill="#e8c15a" font-size="${W/40}" font-weight="700">${k+1}</text>`).join('');
}
function cornerColor(d,w,h){
  const pts=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([x,y])=>{const o=(y*w+x)*4;return [d[o],d[o+1],d[o+2]]});
  return [0,1,2].map(k=>Math.round(pts.reduce((a,p)=>a+p[k],0)/4));
}
function cut(){
  if(!img){alert('先に画像を選んでください');return}
  const names=$('names').value.split(',').map(s=>s.trim()).filter(Boolean);
  outs=[];
  cellRects().forEach(([x,y,w,h],k)=>{
    const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);
    const g=c.getContext('2d');g.drawImage(img,x,y,w,h,0,0,c.width,c.height);
    const id=g.getImageData(0,0,c.width,c.height),d=id.data;
    if($('bg').checked){
      const bg=cornerColor(d,c.width,c.height),tol=+$('tol').value;
      for(let i=0;i<d.length;i+=4){
        const dist=Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2]);
        if(dist<tol)d[i+3]=0; else if(dist<tol*1.6)d[i+3]=Math.round(d[i+3]*(dist-tol)/(tol*.6)); // ふちをなめらかに
      }
      g.putImageData(id,0,0);
    }
    let out=c;
    if($('trim').checked){
      let x1=c.width,y1=c.height,x2=0,y2=0;
      for(let yy=0;yy<c.height;yy++)for(let xx=0;xx<c.width;xx++)if(d[(yy*c.width+xx)*4+3]>10){if(xx<x1)x1=xx;if(yy<y1)y1=yy;if(xx>x2)x2=xx;if(yy>y2)y2=yy}
      if(x2>x1&&y2>y1){
        const m=Math.round(Math.max(x2-x1,y2-y1)*.04), s=Math.max(x2-x1,y2-y1)+m*2;  // 正方形に整える
        out=document.createElement('canvas');out.width=out.height=s;
        out.getContext('2d').drawImage(c,x1,y1,x2-x1+1,y2-y1+1,Math.round((s-(x2-x1))/2),Math.round((s-(y2-y1))/2),x2-x1+1,y2-y1+1);
      }
    }
    outs.push({name:(names[k]||`item-${k+1}`)+'.png',url:out.toDataURL('image/png'),w:out.width});
  });
  $('cells').innerHTML=outs.map((o,k)=>`<div class="cell"><img src="${o.url}"><input value="${o.name}" data-k="${k}"><div class="x">${o.w}px　<a href="#" data-dl="${k}" style="color:#e8c15a">保存</a></div></div>`).join('');
  $('cells').querySelectorAll('input').forEach(i=>i.oninput=()=>outs[i.dataset.k].name=i.value);
  $('cells').querySelectorAll('[data-dl]').forEach(a=>a.onclick=e=>{e.preventDefault();save(outs[a.dataset.dl])});
  $('all').hidden=false;
}
function save(o){const a=document.createElement('a');a.href=o.url;a.download=o.name;document.body.appendChild(a);a.click();a.remove()}
$('cut').onclick=cut;
$('all').onclick=()=>outs.forEach((o,k)=>setTimeout(()=>save(o),k*250));
</script>
</body>
</html>
