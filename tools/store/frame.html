<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,#1a3f86 0,#060a16 70%);font-family:"Noto Sans JP",sans-serif;color:#eaf2ff}
.cap{height:24%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Dela Gothic One",sans-serif;font-size:6.6vw;line-height:1.4;padding:0 6vw;box-sizing:border-box}
.cap div{white-space:nowrap}.cap em{font-style:normal;color:#f5b301}
.ph{position:absolute;left:9%;right:9%;top:24%;bottom:-6%;border-radius:7vw 7vw 0 0;overflow:hidden;border:2.2vw solid #1b2440;border-bottom:0;box-shadow:0 0 0 .5vw #f5b30155,0 3vw 8vw rgba(0,0,0,.6)}
.ph img{width:100%;display:block}
</style></head><body><div class="cap"><div id="cap"></div></div><div class="ph"><img id="shot" alt=""></div>
<script>function setShot(src,cap){document.getElementById('shot').src=src;document.getElementById('cap').innerHTML=cap}</script>
</body></html>
